name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -e esp32dev_full_auto -e esp32dev_full_auto_ota

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.2.0 numpy requests matplotlib
      - run: bash scripts/run_all_tests.sh
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: node --test test/*.cjs
