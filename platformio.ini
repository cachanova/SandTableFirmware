; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
lib_ldf_mode = deep
extra_scripts = post:scripts/patch_async_upload.py
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
	-std=gnu++17
	-O3
	-ffunction-sections
	-fdata-sections
	-I lib/Config/src
	-DCORE_DEBUG_LEVEL=0
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	; Measured AsyncTCP stack use stays below 3.1 KB during upload/image stress.
	; Keep over 5 KB spare while returning 8 KB to the shared network heap.
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	; HTTP callbacks share the web/SD core; never preempt motion on core 1.
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-Wl,--wrap=esp_panic_handler
	-Wl,--wrap=esp_wifi_init
lib_deps =
	tzapu/WiFiManager @ 2.0.17
	esp32async/ESPAsyncWebServer @ 3.9.5
	esp32async/AsyncTCP @ 3.4.10
	bblanchon/ArduinoJson @ 7.4.2
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; This bench setup has intermittently dropped CP2102 uploads at 115200 while
; the driver electronics are connected. Prefer the slower verified rate.
upload_speed = 57600

; Electronics-only bring-up. This build never initializes UART1 or enables
; the TMC2209 drivers or SD bus, but leaves Wi-Fi, the Web UI, and diagnostics
; running. This avoids driving disconnected/floating bench peripherals.
[env:esp32dev_no_motor]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSISYPHUS_SKIP_MOTOR_HARDWARE
	-DSISYPHUS_SKIP_SD_HARDWARE
	-DSISYPHUS_SKIP_OTA

; Non-motion TMC2209 address discovery. Initializes the shared UART, scans all
; four addresses, and applies only a zero-current/bridge-off UART bootstrap.
; It never enables a bridge or emits STEP pulses.
[env:esp32dev_tmc_scan_ota]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSISYPHUS_TMC_UART_SCAN_ONLY
	-DSISYPHUS_SKIP_SD_HARDWARE
upload_protocol = espota
upload_port = 100.76.149.200
upload_flags =
	--auth=sandpatterns

; Temporary electronics-bench image for validating real ESP32 motion timing
; without motors or an SD card. TMC communication and STEP/DIR outputs remain
; active, but the logical origin is assumed instead of running sensorless home.
; Always restore env:esp32dev after the test.
[env:esp32dev_motion_test]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSISYPHUS_BENCH_MOTION_TEST
	-DSISYPHUS_SKIP_SD_HARDWARE
	-DSISYPHUS_SKIP_OTA

[env:esp32dev_motion_test_ota]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSISYPHUS_BENCH_MOTION_TEST
	-DSISYPHUS_SKIP_SD_HARDWARE
upload_protocol = espota
upload_port = 100.76.149.200
upload_flags =
	--auth=sandpatterns

; Single-axis motor commissioning. Only theta tuning tests can start motion;
; rho outputs, homing, manual moves, patterns, and clearing are locked out.
; Every reboot forces a 250mA / 0.05rad/s quiet-first starting envelope.
[env:esp32dev_theta_commissioning]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSISYPHUS_THETA_COMMISSIONING
	-DSISYPHUS_SKIP_SD_HARDWARE

[env:esp32dev_theta_commissioning_ota]
extends = env:esp32dev_theta_commissioning
upload_protocol = espota
upload_port = 100.76.149.200
upload_flags =
	--auth=sandpatterns

; Rho service image: boots in unhomed manual relative-jog mode. A runtime
; switch enables acoustic commissioning after explicit origin confirmation;
; bounded known-position homing is also available. Theta, patterns, and
; clearing remain locked out. Motor presence follows Config, including the
; main-only setup with the unused companion bridge disabled.
[env:esp32dev_rho_commissioning]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSISYPHUS_RHO_COMMISSIONING
	-DSISYPHUS_SKIP_SD_HARDWARE

[env:esp32dev_rho_commissioning_ota]
extends = env:esp32dev_rho_commissioning
upload_protocol = espota
upload_port = 100.76.149.200
upload_flags =
	--auth=sandpatterns

; OTA Upload environment
[env:esp32dev_rho_startup_trial_ota]
extends = env:esp32dev_rho_commissioning_ota
build_flags =
	${env:esp32dev_rho_commissioning.build_flags}
	-DSISYPHUS_RHO_STARTUP_TRIAL

; OTA Upload environment
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 100.76.149.200
upload_flags =
	--auth=sandpatterns

; Native desktop build for motion planner testing
[env:native]
platform = native
build_flags =
	-O2
	-std=c++17
	-DNATIVE_BUILD
	-I lib/PolarControl/src
	-I test/test_motion
build_src_filter =
	-<*>
	+<../test/test_motion/test_main.cpp>
lib_deps =
lib_ignore =
	WiFiManager
	ESPAsyncWebServer
	AsyncTCP
	TMC2209
	ArduinoJson
	PolarControl
	SDCard
	WebServer

; Geometry, precision, braking and pulse generation at the real 50 us period.
[env:native_accuracy]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DSISYPHUS_TEST_STEP_TIMER_PERIOD_US=50
build_src_filter =
    -<*>
    +<../test/test_motion/accuracy_main.cpp>
